name: Release DMG

# Every push to main builds a universal DiskLens.app, packages it as a DMG,
# and publishes it as the latest GitHub release. The in-app updater reads
# that release. Version = contents of ./VERSION + "." + the run number.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          echo "VERSION=$(cat VERSION).${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: swift --version

      - name: Import signing certificate
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12_BASE64" ]; then
            echo "::warning::SIGNING_CERT_P12_BASE64 is not set; the app will be ad-hoc signed and macOS will ask for permissions again after each update."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          echo "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" >/dev/null
          # codesign only finds the private key in keychains on the search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/DiskLens Self-Signed/ {print $2; exit}')"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Build app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Show signature
        run: codesign -d -r- build/DiskLens.app

      - name: Package DMG
        run: ./scripts/make-dmg.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskLens-${{ env.VERSION }}
          path: build/DiskLens-${{ env.VERSION }}.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/DiskLens-$VERSION.dmg" \
            --title "DiskLens $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
